# Fixed-attack vs MAB comparison sweep
# Format: label|start_round|end_round|ramp_end|attack_mode|selection_mode|churn_fraction|layering_mode|layered_k|layered_attacks|layer_multipliers|attack_preset
# BASELINE_clean is auto-added per strategy by the sweep runner.
# All scenarios: 100 clients, 100 rounds, FEMNIST, Dirichlet alpha=0.5, malicious_fraction=0.25
# ramp_end=1.0 everywhere = flat constant intensity (no ramping), standard evaluation protocol.
#
# Intended command:
#   ./run_thesis_sweep.sh \
#     --name fixed_vs_mab_full \
#     --dataset "flwrlabs/femnist" \
#     --dirichlet-alpha 0.5 \
#     --sweeps-file docs/fixed_vs_mab_sweep.conf \
#     --strategies "bulyan,multikrum,fedtrimmedavg,fedmedian,fltrust,foolsgold,flram,mab-rfl" \
#     --repeats 1 \
#     --seeds "1337,42,2024" \
#     --trust-level full \
#     --extra-config "num-server-rounds=100"
#
# To regenerate the HTML report after the sweep completes:
#   python scripts/fixed_vs_mab_comparison.py "logs/sweeps/*fixed_vs_mab_full*" \
#     --out docs/reports/fixed_vs_mab_full.html && open docs/reports/fixed_vs_mab_full.html

# --- Fixed single-attack scenarios ---
# sticky: same malicious clients every round (standard literature protocol)
# ramp_end=1.0: constant intensity, no ramping
FIXED_GAUSSIAN|0|100|1.0|weighted_random|sticky|0.0|single||||gaussian_noise_only
FIXED_SIGN_FLIP|0|100|1.0|weighted_random|sticky|0.0|single||||sign_flip_only
FIXED_LABEL_FLIP|0|100|1.0|weighted_random|sticky|0.0|single||||label_flip_only
FIXED_BACKDOOR|0|100|1.0|weighted_random|sticky|0.0|single||||backdoor_only
FIXED_ALIE|0|100|1.0|weighted_random|sticky|0.0|single||||alie_only
FIXED_MEAN_SHIFT|0|100|1.0|weighted_random|sticky|0.0|single||||mean_shift_only

# --- MAB adaptive scenarios (three scheduling modes, all flat intensity) ---
# STICKY: same malicious clients every round — apples-to-apples vs fixed attacks
MAB_ADAPTIVE_STICKY|0|100|1.0|adaptive|sticky|0.0|single||||
# CHURN: ~50% rotate each round — evades reputation-based defenses
MAB_ADAPTIVE_CHURN|0|100|1.0|adaptive|churn|0.5|single||||
# RANDOM: fully re-randomized every round — maximum evasion
MAB_ADAPTIVE_RANDOM|0|100|1.0|adaptive|per_round_random|0.5|single||||
